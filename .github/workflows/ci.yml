name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.6
      - run: forge install OpenZeppelin/openzeppelin-contracts@v5.4.0
        working-directory: contracts
      - run: forge install foundry-rs/forge-std@v1.9.7
        working-directory: contracts
      - run: forge test
        working-directory: contracts
